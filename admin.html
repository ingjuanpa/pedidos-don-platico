<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin TXT Don Platico</title>
<style>
body{font-family:Work Sans,sans-serif;padding:18px;max-width:720px;margin:auto;background:#FBEBCB}
h2{font-family:Baloo 2,sans-serif;margin-bottom:4px}
textarea{width:100%;height:340px;padding:12px;border-radius:10px;border:1.5px solid #ccc;font-size:13px;background:#fff}
button{background:#1F4B3F;color:#fff;padding:14px;border:none;border-radius:10px;font-weight:800;width:100%;margin-top:12px;cursor:pointer;font-size:15px}
#file{width:100%;margin:12px 0}
pre{background:#fff;padding:12px;border-radius:10px;border:1px solid #ddd;white-space:pre-wrap;font-size:12px;overflow:auto}
.box{background:#FFFDF6;border-radius:12px;padding:16px;margin-top:16px;border:1px solid #ddd}
</style>
</head>
<body>
<h2>Admin - Convierte tu TXT de WhatsApp a menu.json</h2>
<p>Sube tu archivo.txt o pega el texto. Detecta fecha y precios automático.</p>

<input type="file" id="file" accept=".txt">
<textarea id="txt" placeholder="Pega aquí tu menú completo de hoy..."></textarea>
<button onclick="procesar()">Convertir a menu.json</button>

<div class="box">
<strong id="status">Esperando menú...</strong>
<pre id="out">Aquí aparecerá el JSON listo para tu menu.json</pre>
<button id="copyBtn" style="display:none;background:#25D366" onclick="copiar()">📋 Copiar JSON</button>
</div>

<script>
function limpiarPrecio(s){
  let d = s.replace(/\./g,'').replace(/[^0-9]/g,'');
  return parseInt(d||'0',10);
}
function limpiarNombre(s){
  return s.replace(/^\*+\s*/,'').split('$')[0].split(':')[0].replace(/\s+/g,' ').trim();
}
function detectarFecha(t){
  let meses={enero:'01',febrero:'02',marzo:'03',abril:'04',mayo:'05',junio:'06',julio:'07',agosto:'08',septiembre:'09',setiembre:'09',octubre:'10',noviembre:'11',diciembre:'12'};
  let m=t.toLowerCase().match(/(\w+)\s+(\d{1,2})\s+(\d{4})/);
  if(m && meses[m[1]]) return `${m[3]}-${meses[m[1]]}-${String(m[2]).padStart(2,'0')}`;
  let m2=t.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m2) return m2[0];
  return new Date().toISOString().slice(0,10);
}
function extraerSeccion(texto,inicio,fines){
  let idx=texto.toLowerCase().indexOf(inicio.toLowerCase());
  if(idx==-1) return '';
  let resto=texto.slice(idx+inicio.length);
  let fin=resto.length;
  fines.forEach(f=>{
    let j=resto.toLowerCase().indexOf(f.toLowerCase());
    if(j!=-1 && j<fin) fin=j;
  });
  return resto.slice(0,fin);
}
function parseItems(sec){
  let items=[];
  sec.split('\n').forEach(l=>{
    l=l.trim(); if(!l) return;
    let low=l.toLowerCase();
    if(low.includes('buen día')||low.includes('danos tu nombre')||low.includes('dirección')||low.includes('domicilio')||low.includes('nequi')||low.startsWith('1.')||low.startsWith('2.')||low.startsWith('3.')) return;
    if(!l.includes('$')) return;
    let nombre=limpiarNombre(l);
    let precio=limpiarPrecio(l.split('$').pop());
    if(nombre.length<3 || precio<1000) return;
    items.push({nombre, precio});
  });
  return items;
}
function procesar(){
  let txt=document.getElementById('txt').value;
  if(!txt.trim()){alert('Pega tu menú primero');return;}
  let fecha=detectarFecha(txt);
  let s1=extraerSeccion(txt,'Platos Principales',['Platos a la carta','Adicionales','Bebidas']);
  let s2=extraerSeccion(txt,'Platos a la carta',['Adicionales','Bebidas']);
  let s3=extraerSeccion(txt,'Adicionales',['Bebidas']);
  let s4=extraerSeccion(txt,'Bebidas',['']);
  let data={
    fecha: fecha,
    platosPrincipales: parseItems(s1),
    platosCarta: parseItems(s2),
    adicionales: parseItems(s3),
    bebidas: parseItems(s4)
  };
  document.getElementById('status').textContent=`✅ Fecha: ${fecha} | Principales:${data.platosPrincipales.length} Carta:${data.platosCarta.length} Adicionales:${data.adicionales.length} Bebidas:${data.bebidas.length}`;
  document.getElementById('out').textContent=JSON.stringify(data,null,2);
  document.getElementById('copyBtn').style.display='block';
}
document.getElementById('file').addEventListener('change',e=>{
  let f=e.target.files[0]; if(!f) return;
  let r=new FileReader();
  r.onload=ev=>{document.getElementById('txt').value=ev.target.result; procesar();};
  r.readAsText(f);
});
function copiar(){navigator.clipboard.writeText(document.getElementById('out').textContent); alert('¡Copiado! Ahora pégalo en menu.json');}
</script>
</body>
</html>
